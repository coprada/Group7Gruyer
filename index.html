const $=id=>document.getElementById(id);
const STORE="action-plan-progress-"+ACTION_PLAN.id,REFLECT="action-plan-reflection-"+ACTION_PLAN.id;
let lang="en",done=new Set(),toastTimer;
const ui=()=>UI[lang]||UI.en;
function content(value){if(typeof value==="string")return value;return value?.[lang]||value?.en||Object.values(value||{})[0]||"";}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function notify(msg){$("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600);}
function load(){
 try{const v=JSON.parse(localStorage.getItem(STORE)||"[]");done=new Set(Array.isArray(v)?v.filter(i=>Number.isInteger(i)&&i>=0&&i<ACTION_PLAN.actions.length):[]);$("reflectionText").value=localStorage.getItem(REFLECT)||"";}catch(e){done=new Set();}
}
function persist(){try{localStorage.setItem(STORE,JSON.stringify([...done]));}catch(e){}}
function renderActions(){
 $("actionList").innerHTML=ACTION_PLAN.actions.map((a,i)=>`<article class="action-card ${done.has(i)?"done":""}">
 <div class="check-wrap"><input class="action-check" type="checkbox" id="act${i}" data-index="${i}" ${done.has(i)?"checked":""} aria-label="${esc(content(a.title))}"></div>
 <div class="action-content"><div class="action-meta"><span class="number">#${i+1}</span><span class="category">${esc(content(a.category))}</span></div>
 <h3><label for="act${i}">${esc(content(a.title))}</label></h3><p>${esc(content(a.description))}</p>
 <div class="impact-note">✦ ${esc(content(a.impact))}</div></div></article>`).join("");
 $("actionList").querySelectorAll("input").forEach(el=>el.addEventListener("change",()=>{
  const i=Number(el.dataset.index);el.checked?done.add(i):done.delete(i);persist();renderActions();update();
 }));
}
function updateDashboard(){
 const total=ACTION_PLAN.actions.length,n=done.size,left=total-n,pct=total?Math.round(n/total*100):0,d=ui();
 $("totalCount").textContent=total;$("completedCount").textContent=n;$("remainingCount").textContent=left;$("percentCount").textContent=pct+"%";
 $("progressCount").textContent=d.count(n,total);$("progressPercent").textContent=pct+"%";$("mainFill").style.width=pct+"%";$("mainProgress").setAttribute("aria-valuenow",pct);
 $("completionMessage").textContent=total>0&&n===total?d.allDone:n===0?d.keepGoing:d.remainingMsg(left);
}
function updateImpact(){
 const d=ui(),selected=[...done].sort((a,b)=>a-b).map(i=>ACTION_PLAN.actions[i]);
 if(!selected.length){$("impactSummary").textContent=d.noActions;$("selectedActions").innerHTML="";}
 else{
  const titles=selected.map(a=>content(a.title)),impacts=selected.map(a=>content(a.impact));
  $("impactSummary").textContent=(lang==="en"?"By completing ":"Sa pamamagitan ng mga natapos na gawain: ")+titles.join("; ")+". "+impacts.join(" ");
  $("selectedActions").innerHTML=`<li><strong>${esc(d.selected)}</strong></li>`+titles.map(s=>`<li>${esc(s)}</li>`).join("");
 }
 $("impactCategories").innerHTML=ACTION_PLAN.impactCategories.map(cat=>{
  const relevant=ACTION_PLAN.actions.map((a,i)=>({a,i})).filter(x=>(x.a.tags||[]).includes(cat.id));
  const count=relevant.filter(x=>done.has(x.i)).length,pct=relevant.length?Math.round(count/relevant.length*100):0;
  return `<article class="impact-card"><h3>${esc(content(cat.name))}</h3><div class="impact-percent">${pct}%</div><div class="track"><div class="fill" style="width:${pct}%"></div></div><small>${relevant.length?esc(d.coverageText(count,relevant.length)):esc(d.coverageEmpty)}</small></article>`;
 }).join("");
}
function renderLearning(){
 $("learningCards").innerHTML=ACTION_PLAN.learning.map(x=>`<article class="learning-card"><div class="emoji">${esc(x.icon||"📘")}</div><h3>${esc(content(x.title))}</h3><p>${esc(content(x.text))}</p></article>`).join("");
}
function renderReflection(){
 const v=localStorage.getItem(REFLECT)||"";$("reflectionPreview").textContent=v?ui().reflectionSaved+": "+v:"";
}
function update(){updateDashboard();updateImpact();}
function applyLanguage(){
 const d=ui(),mapping={languageLabel:"language",eyebrow:"eyebrow",progressHeading:"progress",progressIntro:"progressIntro",totalLabel:"total",completedLabel:"completed",remainingLabel:"remaining",percentLabel:"completion",checklistHeading:"checklist",checklistIntro:"checklistIntro",selectAll:"selectAll",clearAll:"clearAll",resetBtn:"reset",printBtn:"print",impactHeading:"impact",impactIntro:"impactIntro",coverageHeading:"coverage",coverageNote:"coverageNote",learningHeading:"learning",learningIntro:"learningIntro",reflectionHeading:"reflection",reflectionLabel:"write",saveReflection:"save"};
 Object.entries(mapping).forEach(([id,key])=>$(id).textContent=d[key]);
 $("pageTitle").textContent=content(ACTION_PLAN.title);$("objective").textContent=content(ACTION_PLAN.objective);$("heroClosing").textContent=content(ACTION_PLAN.closing);
 $("reflectionPrompt").textContent=content(ACTION_PLAN.reflectionQuestion);$("reflectionText").placeholder=d.placeholder;$("footerMessage").textContent=content(ACTION_PLAN.closing)||d.footer;
 renderActions();renderLearning();update();renderReflection();
}
$("languageSelect").addEventListener("change",e=>{lang=e.target.value;applyLanguage();});
$("selectAll").addEventListener("click",()=>{done=new Set(ACTION_PLAN.actions.map((_,i)=>i));persist();renderActions();update();});
$("clearAll").addEventListener("click",()=>{done.clear();persist();renderActions();update();});
$("resetBtn").addEventListener("click",()=>{if(confirm(ui().resetConfirm)){done.clear();$("reflectionText").value="";localStorage.removeItem(STORE);localStorage.removeItem(REFLECT);renderActions();update();renderReflection();notify(ui().resetDone);}});
$("printBtn").addEventListener("click",()=>window.print());
$("saveReflection").addEventListener("click",()=>{try{localStorage.setItem(REFLECT,$("reflectionText").value.trim());}catch(e){}renderReflection();notify(ui().saved);});
load();applyLanguage();
</script>
</body>
</html>
